{% extends "layout.html" %}

{% block title %}Offline | Fireground Trainer{% endblock %}

{% block head_extra %}
<style>
  body {
    margin: 0;
    font-family: system-ui, Arial, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(176, 28, 46, 0.24), transparent 28%),
      linear-gradient(180deg, #241015 0%, #14080b 100%);
    color: #fdf7f7;
    min-height: 100vh;
    display: grid;
    place-items: center;
  }

  .card {
    width: min(640px, 92vw);
    background: linear-gradient(180deg, rgba(40, 15, 21, 0.96), rgba(21, 9, 12, 0.96));
    border: 1px solid rgba(255, 226, 231, 0.12);
    border-radius: 14px;
    padding: 20px;
  }

  h1 {
    margin: 0 0 8px;
  }

  p {
    margin: 0;
    line-height: 1.4;
    color: #f0d8dd;
  }
</style>
{% endblock %}

{% block body %}
<section class="card">
  <h1>You are offline</h1>
  <p>Fireground Trainer could not reach the network. Reconnect and reload to resume live scenario content.</p>
</section>
{% endblock %}
