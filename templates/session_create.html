{% extends "layout.html" %}

{% block title %}Create Session | Fireground Trainer{% endblock %}

{% block body %}
<main style="max-width: 760px; margin: 24px auto; padding: 0 16px; font-family: system-ui, Arial;">
  <section style="margin-bottom: 14px;">
    <h1 style="margin:0 0 6px;">Create Training Session</h1>
    <p style="margin:0; color:#444;">Generate a join code (and QR) for participants to join this scenario session.</p>
    <p style="margin:8px 0 0;"><a href="{{ url_for('scenario_library') }}">Back to Library</a></p>
  </section>

  {% if error %}
    <section style="margin-bottom:12px; border:1px solid #d93025; border-radius:10px; padding:10px; background:#fdecea; color:#7f1d1d;">
      {{ error }}
    </section>
  {% endif %}

  <form method="post" action="{{ url_for('create_training_session') }}" style="border:1px solid #d6d9e0; border-radius:12px; padding:14px; display:grid; gap:10px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>
      <div style="font-weight:700; margin-bottom:4px;">Scenario</div>
      <select name="scenario_id" required style="width:100%; padding:8px; border:1px solid #bcc2ce; border-radius:8px;">
        {% for scenario in scenarios %}
          <option value="{{ scenario.id }}" {% if selected_scenario_id == scenario.id %}selected{% endif %}>
            {{ scenario.title }} ({{ scenario.status | replace('_', ' ') | title }})
          </option>
        {% endfor %}
      </select>
    </label>

    <label>
      <div style="font-weight:700; margin-bottom:4px;">Session Title (optional)</div>
      <input name="title" value="{{ form_values.title }}" placeholder="Example: B Shift Night Drill" style="width:100%; padding:8px; border:1px solid #bcc2ce; border-radius:8px;">
    </label>

    <div>
      <button type="submit" style="padding:9px 12px; border:0; border-radius:8px; background:#1e3a8a; color:#fff; font-weight:700;">Create Session</button>
    </div>
  </form>
</main>
{% endblock %}
