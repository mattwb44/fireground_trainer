{% extends "layout.html" %}

{% block title %}Create Session | Fireground Trainer{% endblock %}

{% block body %}
<main class="page-shell page-shell-narrow">
  <section style="margin-bottom: 14px;">
    <h1 style="margin:0 0 6px;">Create Training Session</h1>
    <p style="margin:0; color:var(--site-muted);">Generate a join code (and QR) for participants to join this scenario session.</p>
    <p style="margin:8px 0 0;"><a href="{{ url_for('scenarios.scenario_library') }}">Back to Library</a></p>
  </section>

  {% if error %}
    <section class="theme-alert-error" style="margin-bottom:12px;">
      {{ error }}
    </section>
  {% endif %}

  <form method="post" action="{{ url_for('sessions.create_training_session') }}" class="theme-panel" style="display:grid; gap:10px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>
      <div style="font-weight:700; margin-bottom:4px;">Scenario</div>
      <select name="scenario_id" required class="theme-select">
        {% for scenario in scenarios %}
          <option value="{{ scenario.id }}" {% if selected_scenario_id == scenario.id %}selected{% endif %}>
            {{ scenario.title }} ({{ scenario.status | replace('_', ' ') | title }})
          </option>
        {% endfor %}
      </select>
    </label>

    <label>
      <div style="font-weight:700; margin-bottom:4px;">Session Title (optional)</div>
      <input name="title" value="{{ form_values.title }}" placeholder="Example: B Shift Night Drill" class="theme-input">
    </label>

    <div>
      <button type="submit" class="theme-button-blue">Create Session</button>
    </div>
  </form>
</main>
{% endblock %}
