{% extends "layout.html" %}

{% block title %}Magic Link | Fireground Trainer{% endblock %}

{% block body %}
<main class="page-shell page-shell-compact" style="max-width:560px;">
  <section class="theme-panel-strong">
    <h1 style="margin-top:0;">Request Magic Link</h1>
    <p style="margin-top:0; color:var(--site-muted);">Enter your staff email to receive a one-time sign-in link.</p>

    {% if error %}
      <p class="theme-alert-error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('auth.request_magic_link_submit') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="email" style="display:block; margin:10px 0 4px; font-weight:700;">Email</label>
      <input id="email" name="email" type="email" required class="theme-input">

      <button type="submit" class="theme-button-blue" style="margin-top:14px;">Send Link</button>
    </form>

    <p style="margin:12px 0 0;">
      <a href="{{ url_for('auth.login_page') }}">Back to password login</a>
    </p>
  </section>
</main>
{% endblock %}
